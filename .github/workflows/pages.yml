name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate game
        run: node scripts/check.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site/promo
          cp *.html *.css *.js _site/
          cp -R vendor _site/
          cp promo/index.html promo/poster.jpg promo/spin-for-glory.mp4 _site/promo/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
